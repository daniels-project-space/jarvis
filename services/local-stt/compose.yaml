services:
  local-stt:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STT_MODEL: turbo
      STT_DEVICE: auto
      STT_COMPUTE_TYPE: int8
      # Set this in the host shell or a protected compose override, never commit it.
      STT_SHARED_SECRET: ${LOCAL_STT_SHARED_SECRET:?set_LOCAL_STT_SHARED_SECRET}
    volumes:
      - jarvis-stt-models:/models

volumes:
  jarvis-stt-models:
