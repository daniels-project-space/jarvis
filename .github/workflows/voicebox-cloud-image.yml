name: Build Jarvis Voicebox image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/voicebox
          push: true
          tags: |
            ghcr.io/daniels-project-space/jarvis-voicebox:${{ github.sha }}
            ghcr.io/daniels-project-space/jarvis-voicebox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
