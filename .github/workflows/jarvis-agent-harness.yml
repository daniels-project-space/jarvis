name: Jarvis CLI agent harness

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Wake reason
        required: false
        default: manual
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  run:
    name: Subscription CLI agents
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CONVEX_URL: https://tangible-goose-318.convex.cloud
      CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
      JARVIS_WORKER_TOKEN: ${{ secrets.JARVIS_WORKER_TOKEN }}
      VAULT_ACCESS_TOKEN: ${{ secrets.VAULT_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.JARVIS_PORTFOLIO_GITHUB_TOKEN }}
      JARVIS_AGENT_RUNTIME: github
      JARVIS_HARNESS_SELF_TEST: ${{ inputs.reason == 'cli-tool-self-test' && '1' || '0' }}
    steps:
      - name: Check out Jarvis harness
        uses: actions/checkout@v4

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned harness
        run: npm ci

      - name: Verify Codex agent toolchain
        run: |
          missing=0
          for tool in curl git node npm npx gh; do
            if ! command -v "$tool"; then
              echo "::error::Codex worker toolchain is missing $tool on PATH"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Run durable CLI agents
        run: npm run agent:harness
