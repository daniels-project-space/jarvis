server {
    listen 80;
    listen [::]:80;
    server_name speech.87.106.233.113.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name speech.87.106.233.113.nip.io;

    ssl_certificate /etc/letsencrypt/live/speech.87.106.233.113.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speech.87.106.233.113.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/stream {
        proxy_pass http://127.0.0.1:8081/v1/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Final, high-accuracy transcription remains separately authenticated by
    # LOCAL_STT_SHARED_SECRET. Nginx never logs or injects that capability.
    location = /v1/audio/transcriptions {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8080/v1/audio/transcriptions;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
